[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/audio-analysis",
  "crates/audio-engine",
  "crates/project-model",
  "crates/project-store",
  "crates/timing-engine",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.78"

[workspace.dependencies]
approx = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hound = "3.5"
tempfile = "3"
cpal = "0.15"
crossbeam-queue = "0.3"
